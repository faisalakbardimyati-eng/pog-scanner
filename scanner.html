<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>POG Camera Scanner</title>


  <!-- HTML5 QR CODE -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;

    }


    body {

      padding: 10px;

    }


    .container {

      width: 100%;

      max-width: 500px;

      margin: auto;

    }


    h2 {

      text-align: center;

      font-size: 20px;

      margin: 10px 0 15px;

    }


    /* ============================
       CAMERA
       ============================ */

    #reader {

      width: 100%;

      min-height: 280px;

      margin-top: 10px;

      background: #000;

      border-radius: 12px;

      overflow: hidden;

      position: relative;

    }


    /*
      Hilangkan beberapa elemen bawaan
      html5-qrcode yang tidak diperlukan
    */

    #reader__dashboard {

      padding: 8px !important;

    }


    #reader__dashboard_section_swaplink {

      display: none !important;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      object-fit: cover !important;

      border-radius: 10px;

    }


    /* ============================
       RESULT
       ============================ */

    .result {

      margin-top: 12px;

      padding: 15px;

      background: white;

      color: #111;

      border-radius: 10px;

      text-align: center;

    }


    .result-title {

      font-size: 12px;

      color: #666;

      font-weight: bold;

    }


    #barcodeResult {

      margin-top: 6px;

      font-size: 21px;

      font-weight: bold;

      word-break: break-all;

      color: #111;

    }


    /* ============================
       STATUS
       ============================ */

    .status {

      margin-top: 12px;

      padding: 8px;

      text-align: center;

      color: #bbb;

      font-size: 13px;

      min-height: 32px;

    }


    /* ============================
       BUTTON
       ============================ */

    button {

      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border: 0;

      border-radius: 8px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      touch-action: manipulation;

    }


    #start {

      background: #0d8a43;

      color: white;

    }


    #stop {

      background: #d93025;

      color: white;

    }


    button:disabled {

      opacity: 0.6;

    }


    /* ============================
       SCAN GUIDE
       ============================ */

    .scan-guide {

      position: absolute;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%);

      width: 82%;

      height: 110px;

      border: 2px solid #00ff66;

      border-radius: 8px;

      pointer-events: none;

      box-shadow:

        0 0 0 9999px rgba(0,0,0,0.25);

      z-index: 10;

    }


    .scan-line {

      position: absolute;

      left: 5%;

      width: 90%;

      height: 2px;

      background: #00ff66;

      top: 50%;

      box-shadow:

        0 0 8px #00ff66;

      animation: scanLine 1.5s linear infinite;

    }


    @keyframes scanLine {

      0% {

        transform: translateY(-45px);

      }

      50% {

        transform: translateY(45px);

      }

      100% {

        transform: translateY(-45px);

      }

    }


    .hint {

      margin-top: 10px;

      text-align: center;

      color: #aaa;

      font-size: 11px;

      line-height: 1.5;

    }


  </style>

</head>


<body>


<div class="container">


  <h2>
    📷 POG BARCODE SCANNER
  </h2>


  <!-- CAMERA -->

  <div id="reader">

    <div class="scan-guide">

      <div class="scan-line"></div>

    </div>

  </div>


  <!-- RESULT -->

  <div class="result">

    <div class="result-title">
      BARCODE TERBACA
    </div>

    <div id="barcodeResult">
      -
    </div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    Menyiapkan kamera...
  </div>


  <!-- BUTTON START -->

  <button
    id="start"
    onclick="startScanner()"
  >
    📷 MULAI SCAN
  </button>


  <!-- BUTTON STOP -->

  <button
    id="stop"
    onclick="stopScanner()"
  >
    ❌ TUTUP KAMERA
  </button>


  <div class="hint">

    Arahkan kamera belakang ke barcode.<br>

    Pastikan barcode cukup terang dan tidak terlalu jauh.

  </div>


</div>



<script>


// =====================================================
// GLOBAL
// =====================================================

let scanner = null;

let scanning = false;

let sudahScan = false;

let starting = false;


// =====================================================
// STATUS
// =====================================================

function status(text) {

  const el =
    document.getElementById('status');

  if (el) {

    el.textContent = text;

  }

}


// =====================================================
// BUTTON
// =====================================================

function updateButtons() {

  const start =
    document.getElementById('start');

  const stop =
    document.getElementById('stop');


  if (scanning) {

    start.style.display =
      'none';

    stop.style.display =
      'block';

  } else {

    start.style.display =
      'block';

    stop.style.display =
      'none';

  }

}


// =====================================================
// START SCANNER
// =====================================================

async function startScanner() {


  // Jangan start dua kali

  if (
    scanning ||
    starting
  ) {

    return;

  }


  starting = true;

  sudahScan = false;


  status(
    '📷 Meminta izin kamera...'
  );


  updateButtons();


  try {


    // =================================================
    // CEK HTTPS
    // =================================================

    if (
      location.protocol !== 'https:' &&
      location.hostname !== 'localhost'
    ) {

      throw new Error(
        'Kamera membutuhkan HTTPS.'
      );

    }


    // =================================================
    // CEK CAMERA API
    // =================================================

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    // =================================================
    // BERSIHKAN INSTANCE LAMA
    // =================================================

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {}


      try {

        scanner.clear();

      } catch (e) {}


      scanner = null;

    }


    // =================================================
    // BUAT SCANNER
    // =================================================

    scanner =
      new Html5Qrcode(
        'reader'
      );


    // =================================================
    // KONFIGURASI
    // =================================================

    const config = {

      /*
       * 15 FPS cukup cepat untuk barcode
       * tanpa terlalu membebani HP
       */

      fps: 15,


      /*
       * Area barcode dibuat lebar.
       *
       * Cocok untuk:
       * EAN
       * UPC
       * CODE128
       * CODE39
       */

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const width =
          Math.floor(
            viewfinderWidth * 0.90
          );


        const height =
          Math.floor(
            Math.min(
              140,
              viewfinderHeight * 0.32
            )
          );


        return {

          width:
            Math.max(
              250,
              width
            ),

          height:
            Math.max(
              90,
              height
            )

        };

      },


      /*
       * Kamera landscape/portrait
       */

      aspectRatio:
        1.7777778,


      /*
       * Jangan flip kamera
       */

      disableFlip:
        false,


      /*
       * Format barcode yang umum
       */

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.ITF,

        Html5QrcodeSupportedFormats.CODABAR

      ]

    };


    // =================================================
    // START CAMERA
    // =================================================

    scanning = true;

    starting = false;


    await scanner.start(

      /*
       * environment =
       * kamera belakang
       *
       * Ini lebih stabil di Android/iPhone
       */

      {
        facingMode:
          {
            ideal:
              'environment'
          }
      },


      config,


      /*
       * SUCCESS
       */

      function(decodedText) {

        if (
          sudahScan
        ) {

          return;

        }


        const barcode =
          String(
            decodedText || ''
          ).trim();


        if (!barcode) {

          return;

        }


        sudahScan = true;


        barcodeBerhasil(
          barcode
        );

      },


      /*
       * SCAN ERROR
       *
       * Jangan tampilkan alert.
       */

      function(errorMessage) {

        // normal scanning error
        // sengaja diabaikan

      }

    );


    status(
      '✓ Kamera aktif - arahkan barcode ke kotak hijau'
    );


  } catch (error) {


    console.error(
      'START CAMERA ERROR:',
      error
    );


    scanning = false;

    starting = false;

    scanner = null;


    updateButtons();


    handleCameraError(
      error
    );

  }

}


// =====================================================
// CAMERA ERROR
// =====================================================

function handleCameraError(
  error
) {


  const name =
    error?.name || '';


  const message =
    error?.message || '';


  console.error(
    'Camera error:',
    name,
    message
  );


  if (
    name ===
    'NotAllowedError'
  ) {

    status(
      '❌ Izin kamera ditolak'
    );


    alert(

      'IZIN KAMERA DITOLAK\n\n' +

      'Android:\n' +

      'Buka Settings → Apps → Chrome → Permissions → Camera → Allow.\n\n' +

      'iPhone:\n' +

      'Settings → Safari → Camera → Allow.\n\n' +

      'Setelah itu buka scanner kembali.'

    );


    return;

  }


  if (
    name ===
    'NotFoundError'
  ) {

    status(
      '❌ Kamera tidak ditemukan'
    );


    alert(
      'Kamera tidak ditemukan pada perangkat.'
    );


    return;

  }


  if (
    name ===
    'NotReadableError'
  ) {

    status(
      '❌ Kamera sedang digunakan'
    );


    alert(

      'Kamera sedang digunakan aplikasi lain.\n\n' +

      'Tutup aplikasi Camera, WhatsApp, Instagram, ' +

      'atau aplikasi lain yang menggunakan kamera.'

    );


    return;

  }


  if (
    name ===
    'SecurityError'
  ) {

    status(
      '❌ Akses kamera diblokir'
    );


    alert(

      'Akses kamera diblokir browser.\n\n' +

      'Pastikan scanner dibuka menggunakan HTTPS.'

    );


    return;

  }


  status(
    '❌ Kamera gagal dibuka'
  );


  alert(

    'KAMERA GAGAL DIBUKA\n\n' +

    (
      message ||
      name ||
      'Unknown error'
    )

  );

}


// =====================================================
// BARCODE BERHASIL
// =====================================================

async function barcodeBerhasil(
  barcode
) {


  barcode =
    String(
      barcode || ''
    ).trim();


  if (!barcode) {

    return;

  }


  // =================================================
  // TAMPILKAN HASIL
  // =================================================

  document.getElementById(
    'barcodeResult'
  ).textContent =
    barcode;


  status(
    '✓ Barcode berhasil dibaca'
  );


  // =================================================
  // GETAR
  // =================================================

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [80, 40, 80]
      );

    }

  } catch (e) {}


  // =================================================
  // BUNYI
  // =================================================

  bunyiScan();


  // =================================================
  // STOP CAMERA
  // =================================================

  await stopScanner(
    false
  );


  // =================================================
  // KIRIM KE HALAMAN UTAMA
  // =================================================

  kirimBarcode(
    barcode
  );

}


// =====================================================
// KIRIM BARCODE KE INDEX.HTML
// =====================================================

function kirimBarcode(
  barcode
) {


  try {


    if (
      !window.opener ||
      window.opener.closed
    ) {

      status(
        '⚠ Halaman utama tidak ditemukan'
      );

      return;

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnOrigin =
      params.get(
        'returnOrigin'
      );


    if (!returnOrigin) {

      status(
        '⚠ returnOrigin tidak ditemukan'
      );

      return;

    }


    window.opener.postMessage(

      {

        type:
          'POG_BARCODE',

        barcode:
          barcode

      },


      returnOrigin

    );


    status(
      '✓ Barcode dikirim ke halaman utama'
    );


    // =================================================
    // TUTUP WINDOW SCANNER
    // =================================================

    setTimeout(
      function() {

        try {

          window.close();

        } catch (e) {}

      },
      400
    );


  } catch (error) {

    console.error(
      'POST MESSAGE ERROR:',
      error
    );


    status(
      '❌ Gagal mengirim barcode'
    );

  }

}


// =====================================================
// STOP SCANNER
// =====================================================

async function stopScanner(
  tampilStatus = true
) {


  if (!scanner) {

    scanning = false;

    starting = false;

    updateButtons();

    return;

  }


  try {


    if (scanning) {

      await scanner.stop();

    }


  } catch (error) {

    console.warn(
      'Scanner stop:',
      error
    );

  }


  try {

    scanner.clear();

  } catch (error) {

    console.warn(
      'Scanner clear:',
      error
    );

  }


  scanner = null;

  scanning = false;

  starting = false;


  updateButtons();


  if (tampilStatus) {

    status(
      'Kamera ditutup'
    );

  }

}


// =====================================================
// BUNYI SCAN
// =====================================================

function bunyiScan() {


  try {


    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const audioCtx =
      new AudioContext();


    const oscillator =
      audioCtx.createOscillator();


    const gain =
      audioCtx.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      1800;


    gain.gain.value =
      0.12;


    oscillator.connect(
      gain
    );


    gain.connect(
      audioCtx.destination
    );


    oscillator.start();


    setTimeout(
      function() {

        try {

          oscillator.stop();

          audioCtx.close();

        } catch (e) {}

      },
      100

    );


  } catch (error) {

    console.log(
      'Audio tidak tersedia'
    );

  }

}


// =====================================================
// AUTO START
// =====================================================

window.addEventListener(
  'load',
  function() {

    updateButtons();


    setTimeout(
      function() {

        startScanner();

      },
      700
    );

  }
);


// =====================================================
// PAGE HIDDEN
// =====================================================

document.addEventListener(
  'visibilitychange',
  function() {


    /*
     * Jika halaman ditinggalkan,
     * hentikan kamera supaya tidak
     * tetap menggunakan kamera HP.
     */

    if (
      document.hidden &&
      scanning
    ) {

      stopScanner(
        false
      );

    }

  }
);


// =====================================================
// PAGE CLOSE
// =====================================================

window.addEventListener(
  'beforeunload',
  function() {

    if (scanner) {

      try {

        scanner.stop();

      } catch (e) {}

    }

  }
);


</script>


</body>

</html>
