SCANER

<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>POG Camera Scanner</title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      padding: 15px;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;

      max-width: 500px;

      margin: auto;
    }

    h2 {
      text-align: center;
    }

    #reader {
      width: 100%;

      margin-top: 15px;

      background: #222;

      border-radius: 10px;

      overflow: hidden;
    }

    .result {
      margin-top: 15px;

      padding: 15px;

      background: white;

      color: #111;

      border-radius: 8px;

      text-align: center;
    }

    #barcodeResult {
      margin-top: 5px;

      font-size: 22px;

      font-weight: bold;

      word-break: break-all;
    }

    .status {
      margin-top: 15px;

      text-align: center;

      color: #aaa;

      font-size: 13px;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 10px;

      border: 0;

      border-radius: 8px;

      font-size: 16px;

      font-weight: bold;
    }

    #start {
      background: #0d8a43;

      color: white;
    }

    #stop {
      background: #d93025;

      color: white;
    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📷 POG BARCODE SCANNER
  </h2>


  <div id="reader"></div>


  <div class="result">

    <div>
      BARCODE
    </div>

    <div id="barcodeResult">
      -
    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    Menunggu kamera...
  </div>


  <button
    id="start"
    onclick="startScanner()"
  >
    📷 MULAI SCAN
  </button>


  <button
    id="stop"
    onclick="stopScanner()"
  >
    ❌ TUTUP KAMERA
  </button>


</div>



<script>

let scanner = null;

let scanning = false;

let sudahScan = false;


// ========================================
// STATUS
// ========================================

function status(text) {

  document.getElementById(
    'status'
  ).textContent = text;

}


// ========================================
// START
// ========================================

async function startScanner() {

  if (scanning) {
    return;
  }

  sudahScan = false;

  status(
    'Meminta izin kamera...'
  );


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 120
      },

      aspectRatio: 1.777778,

      disableFlip: false

    };


    scanning = true;


    await scanner.start(

      {
        facingMode: 'environment'
      },

      config,


      function(decodedText) {

        if (sudahScan) {
          return;
        }

        sudahScan = true;

        barcodeBerhasil(
          decodedText
        );

      },


      function(errorMessage) {

        // Abaikan error scanning biasa

      }

    );


    status(
      '✓ Kamera aktif - arahkan ke barcode'
    );


  } catch (error) {

    console.error(
      'CAMERA ERROR:',
      error
    );


    scanning = false;


    status(
      '❌ Kamera gagal dibuka'
    );


    let pesan =
      'KAMERA GAGAL DIBUKA\n\n';


    if (
      error.name ===
      'NotAllowedError'
    ) {

      pesan +=
        'Izin kamera ditolak.\n\n' +

        'Tekan ikon 🔒 pada browser, ' +
        'kemudian izinkan Camera.';


    } else if (
      error.name ===
      'NotFoundError'
    ) {

      pesan +=
        'Kamera tidak ditemukan.';


    } else if (
      error.name ===
      'NotReadableError'
    ) {

      pesan +=
        'Kamera sedang digunakan aplikasi lain.';


    } else {

      pesan +=
        (
          error.message ||
          error.name ||
          'Unknown error'
        );

    }


    alert(pesan);

  }

}


// ========================================
// BARCODE BERHASIL
// ========================================

async function barcodeBerhasil(
  barcode
) {

  barcode =
    String(
      barcode || ''
    ).trim();


  if (!barcode) {
    return;
  }


  document.getElementById(
    'barcodeResult'
  ).textContent =
    barcode;


  status(
    '✓ Barcode berhasil dibaca'
  );


  // Getar HP

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }


  // Stop kamera

  await stopScanner();


  // ====================================
  // KIRIM KE HALAMAN UTAMA
  // ====================================

  if (
    window.opener &&
    !window.opener.closed
  ) {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnOrigin =
      params.get(
        'returnOrigin'
      );


    if (returnOrigin) {

      window.opener.postMessage(

        {
          type:
            'POG_BARCODE',

          barcode:
            barcode
        },

        returnOrigin

      );


      status(
        '✓ Barcode dikirim ke aplikasi'
      );


      setTimeout(
        function() {

          window.close();

        },
        500
      );

    }

  }

}


// ========================================
// STOP
// ========================================

async function stopScanner() {

  try {

    if (
      scanner &&
      scanning
    ) {

      await scanner.stop();

    }


    if (scanner) {

      try {

        scanner.clear();

      } catch (e) {}

    }

  } catch (error) {

    console.error(
      error
    );

  }


  scanner = null;

  scanning = false;

}


// ========================================
// AUTO START
// ========================================

window.addEventListener(
  'load',
  function() {

    setTimeout(
      startScanner,
      500
    );

  }
);

</script>


</body>

</html>
