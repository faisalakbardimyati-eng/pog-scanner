<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>POG Camera Scanner</title>


  <!-- HTML5 QR CODE -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      min-height: 100%;

      margin: 0;
      padding: 0;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      -webkit-text-size-adjust: 100%;

      touch-action: manipulation;

    }


    body {

      padding: 10px;

    }


    .container {

      width: 100%;

      max-width: 500px;

      margin: auto;

    }


    h2 {

      text-align: center;

      font-size: 19px;

      margin: 8px 0 12px;

    }


    /* =========================================
       CAMERA
       ========================================= */

    #reader {

      width: 100%;

      height: auto;

      min-height: 280px;

      margin-top: 8px;

      background: #000;

      border-radius: 12px;

      overflow: hidden;

      position: relative;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      max-height: 65vh;

      object-fit: cover !important;

      border-radius: 10px;

    }


    #reader__dashboard {

      padding: 5px !important;

    }


    #reader__dashboard_section_swaplink {

      display: none !important;

    }


    #reader__camera_selection {

      display: none !important;

    }


    /* =========================================
       SCAN GUIDE
       ========================================= */

    .scan-guide {

      position: absolute;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%);

      width: 88%;

      height: 105px;

      border: 2px solid #00ff66;

      border-radius: 8px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.25);

      z-index: 20;

    }


    .scan-line {

      position: absolute;

      left: 4%;

      width: 92%;

      height: 2px;

      background: #00ff66;

      box-shadow:
        0 0 8px #00ff66;

      animation:
        scanLine 1.3s linear infinite;

    }


    @keyframes scanLine {

      0% {
        top: 5%;
      }

      50% {
        top: 90%;
      }

      100% {
        top: 5%;
      }

    }


    /* =========================================
       RESULT
       ========================================= */

    .result {

      margin-top: 10px;

      padding: 13px;

      background: white;

      color: #111;

      border-radius: 9px;

      text-align: center;

    }


    .result-title {

      font-size: 11px;

      color: #666;

      font-weight: bold;

    }


    #barcodeResult {

      margin-top: 5px;

      font-size: 21px;

      font-weight: bold;

      word-break: break-all;

      color: #111;

    }


    /* =========================================
       STATUS
       ========================================= */

    .status {

      margin-top: 8px;

      padding: 7px;

      text-align: center;

      color: #bbb;

      font-size: 12px;

      min-height: 30px;

    }


    /* =========================================
       BUTTON
       ========================================= */

    button {

      width: 100%;

      padding: 13px;

      margin-top: 7px;

      border: 0;

      border-radius: 8px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      touch-action: manipulation;

    }


    #start {

      background: #0d8a43;

      color: white;

    }


    #stop {

      background: #d93025;

      color: white;

      display: none;

    }


    button:disabled {

      opacity: 0.55;

    }


    .hint {

      margin-top: 8px;

      text-align: center;

      color: #999;

      font-size: 11px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📷 POG BARCODE SCANNER
  </h2>


  <!-- CAMERA -->

  <div id="reader">

    <div class="scan-guide">

      <div class="scan-line"></div>

    </div>

  </div>


  <!-- RESULT -->

  <div class="result">

    <div class="result-title">
      BARCODE TERBACA
    </div>

    <div id="barcodeResult">
      -
    </div>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    Menyiapkan kamera...
  </div>


  <!-- START -->

  <button
    id="start"
    type="button"
    onclick="startScanner()"
  >

    📷 MULAI SCAN

  </button>


  <!-- STOP -->

  <button
    id="stop"
    type="button"
    onclick="stopScanner()"
  >

    ❌ TUTUP KAMERA

  </button>


  <div class="hint">

    Gunakan kamera belakang.<br>

    Dekatkan barcode sampai berada di dalam kotak hijau.

  </div>


</div>



<script>


// =====================================================
// GLOBAL
// =====================================================

let scanner = null;

let scanning = false;

let starting = false;

let sudahScan = false;

let barcodeTerkirim = false;


// =====================================================
// STATUS
// =====================================================

function status(text) {

  const el =
    document.getElementById('status');

  if (el) {

    el.textContent = text;

  }

}


// =====================================================
// BUTTON
// =====================================================

function updateButtons() {

  const start =
    document.getElementById('start');

  const stop =
    document.getElementById('stop');


  if (!start || !stop) {

    return;

  }


  if (scanning) {

    start.style.display =
      'none';

    stop.style.display =
      'block';

  } else {

    start.style.display =
      'block';

    stop.style.display =
      'none';

  }

}


// =====================================================
// START SCANNER
// =====================================================

async function startScanner() {


  // Jangan start dua kali

  if (
    scanning ||
    starting
  ) {

    return;

  }


  starting = true;

  sudahScan = false;

  barcodeTerkirim = false;


  status(
    '📷 Membuka kamera...'
  );


  updateButtons();


  try {


    // =================================================
    // HTTPS
    // =================================================

    if (
      location.protocol !== 'https:' &&
      location.hostname !== 'localhost'
    ) {

      throw new Error(
        'Scanner harus menggunakan HTTPS.'
      );

    }


    // =================================================
    // CAMERA API
    // =================================================

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    // =================================================
    // BERSIHKAN SCANNER LAMA
    // =================================================

    if (scanner) {

      try {

        if (scanning) {

          await scanner.stop();

        }

      } catch (e) {}


      try {

        scanner.clear();

      } catch (e) {}


      scanner = null;

    }


    // =================================================
    // BUAT INSTANCE
    // =================================================

    scanner =
      new Html5Qrcode(
        'reader'
      );


    // =================================================
    // FORMAT BARCODE
    // =================================================

    const formats = [

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.CODABAR

    ];


    // =================================================
    // CONFIG SCANNER
    // =================================================

    const config = {

      /*
       * 12 FPS:
       *
       * cukup cepat untuk barcode
       * tetapi lebih ringan untuk HP
       */

      fps: 12,


      /*
       * Area pembacaan lebar.
       *
       * Barcode 1D lebih mudah terbaca.
       */

      qrbox:
        function(
          width,
          height
        ) {

          const scanWidth =
            Math.floor(
              width * 0.90
            );


          const scanHeight =
            Math.floor(
              Math.min(
                130,
                height * 0.30
              )
            );


          return {

            width:
              Math.max(
                240,
                Math.min(
                  scanWidth,
                  450
                )
              ),

            height:
              Math.max(
                90,
                scanHeight
              )

          };

        },


      /*
       * Format barcode yang diperbolehkan
       */

      formatsToSupport:
        formats,


      /*
       * Jangan flip gambar
       */

      disableFlip:
        false

    };


    // =================================================
    // START CAMERA
    // =================================================

    scanning = true;

    starting = false;


    await scanner.start(

      /*
       * Prioritas kamera belakang.
       *
       * Tidak menggunakan cameraId
       * agar kompatibel Android + iPhone.
       */

      {
        facingMode:
          {
            ideal:
              'environment'
          }
      },


      config,


      // ===============================================
      // BARCODE BERHASIL
      // ===============================================

      function(decodedText) {


        if (sudahScan) {

          return;

        }


        const barcode =
          String(
            decodedText || ''
          ).trim();


        if (!barcode) {

          return;

        }


        sudahScan = true;


        barcodeBerhasil(
          barcode
        );


      },


      // ===============================================
      // SCAN ERROR
      // ===============================================

      function(errorMessage) {

        /*
         * Jangan tampilkan error scanning
         * karena callback ini dipanggil terus
         * saat barcode belum ditemukan.
         */

      }

    );


    status(
      '✓ Kamera aktif - arahkan barcode ke kotak hijau'
    );


    updateButtons();


  } catch (error) {


    console.error(
      'START CAMERA ERROR:',
      error
    );


    scanning = false;

    starting = false;

    scanner = null;


    updateButtons();


    handleCameraError(
      error
    );

  }

}


// =====================================================
// CAMERA ERROR
// =====================================================

function handleCameraError(
  error
) {


  const name =
    error?.name || '';


  const message =
    error?.message || '';


  console.error(
    name,
    message
  );


  if (
    name ===
    'NotAllowedError'
  ) {

    status(
      '❌ Izin kamera ditolak'
    );


    alert(

      'IZIN KAMERA DITOLAK\n\n' +

      'Android:\n' +

      'Izinkan Camera pada permission browser.\n\n' +

      'iPhone:\n' +

      'Settings → Safari → Camera → Allow.'

    );


    return;

  }


  if (
    name ===
    'NotFoundError'
  ) {

    status(
      '❌ Kamera tidak ditemukan'
    );


    alert(
      'Kamera tidak ditemukan.'
    );


    return;

  }


  if (
    name ===
    'NotReadableError'
  ) {

    status(
      '❌ Kamera sedang digunakan'
    );


    alert(

      'Kamera sedang digunakan aplikasi lain.\n\n' +

      'Tutup aplikasi lain yang sedang memakai kamera.'

    );


    return;

  }


  if (
    name ===
    'SecurityError'
  ) {

    status(
      '❌ Akses kamera diblokir'
    );


    alert(

      'Akses kamera diblokir browser.\n\n' +

      'Pastikan scanner menggunakan HTTPS.'

    );


    return;

  }


  status(
    '❌ Kamera gagal dibuka'
  );


  alert(

    'KAMERA GAGAL DIBUKA\n\n' +

    (
      message ||
      name ||
      'Unknown error'
    )

  );

}


// =====================================================
// BARCODE BERHASIL
// =====================================================

async function barcodeBerhasil(
  barcode
) {


  barcode =
    String(
      barcode || ''
    ).trim();


  if (!barcode) {

    return;

  }


  // =================================================
  // TAMPILKAN HASIL
  // =================================================

  document.getElementById(
    'barcodeResult'
  ).textContent =
    barcode;


  status(
    '✓ Barcode berhasil dibaca'
  );


  // =================================================
  // GETAR
  // =================================================

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [70, 40, 70]
      );

    }

  } catch (e) {}


  // =================================================
  // BUNYI
  // =================================================

  bunyiScan();


  // =================================================
  // STOP CAMERA SECEPATNYA
  // =================================================

  await stopScanner(
    false
  );


  // =================================================
  // KIRIM KE HALAMAN UTAMA
  // =================================================

  kirimBarcode(
    barcode
  );

}


// =====================================================
// KIRIM KE INDEX.HTML
// =====================================================

function kirimBarcode(
  barcode
) {


  if (barcodeTerkirim) {

    return;

  }


  barcodeTerkirim = true;


  try {


    if (
      !window.opener ||
      window.opener.closed
    ) {

      status(
        '⚠ Halaman utama tidak ditemukan'
      );

      barcodeTerkirim = false;

      return;

    }


    const params =
      new URLSearchParams(
        window.location.search
      );


    const returnOrigin =
      params.get(
        'returnOrigin'
      );


    if (!returnOrigin) {

      status(
        '⚠ returnOrigin tidak ditemukan'
      );

      barcodeTerkirim = false;

      return;

    }


    // =================================================
    // KIRIM BARCODE
    // =================================================

    window.opener.postMessage(

      {

        type:
          'POG_BARCODE',

        barcode:
          barcode

      },


      returnOrigin

    );


    status(
      '✓ Barcode dikirim ke halaman utama'
    );


    // =================================================
    // TUTUP POPUP
    // =================================================

    setTimeout(
      function() {

        try {

          window.close();

        } catch (e) {}

      },
      350
    );


  } catch (error) {


    console.error(
      'POST MESSAGE ERROR:',
      error
    );


    barcodeTerkirim = false;


    status(
      '❌ Gagal mengirim barcode'
    );

  }

}


// =====================================================
// STOP SCANNER
// =====================================================

async function stopScanner(
  tampilStatus = true
) {


  starting = false;


  const currentScanner =
    scanner;


  if (!currentScanner) {

    scanning = false;

    updateButtons();

    return;

  }


  /*
   * Lepaskan reference lebih awal
   * supaya user tidak bisa melakukan
   * start bersamaan dengan proses stop.
   */

  scanner = null;

  scanning = false;


  updateButtons();


  try {

    await currentScanner.stop();

  } catch (error) {

    console.warn(
      'STOP ERROR:',
      error
    );

  }


  try {

    currentScanner.clear();

  } catch (error) {

    console.warn(
      'CLEAR ERROR:',
      error
    );

  }


  if (tampilStatus) {

    status(
      'Kamera ditutup'
    );

  }

}


// =====================================================
// BUNYI SCAN
// =====================================================

function bunyiScan() {


  try {


    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const audioCtx =
      new AudioContext();


    const oscillator =
      audioCtx.createOscillator();


    const gain =
      audioCtx.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      1800;


    gain.gain.value =
      0.12;


    oscillator.connect(
      gain
    );


    gain.connect(
      audioCtx.destination
    );


    oscillator.start();


    setTimeout(
      function() {

        try {

          oscillator.stop();

          audioCtx.close();

        } catch (e) {}

      },
      90
    );


  } catch (e) {

    console.log(
      'Audio tidak tersedia'
    );

  }

}


// =====================================================
// AUTO START
// =====================================================

window.addEventListener(
  'load',
  function() {


    updateButtons();


    setTimeout(
      function() {

        startScanner();

      },
      500
    );


  }
);


// =====================================================
// VISIBILITY
// =====================================================

document.addEventListener(
  'visibilitychange',
  function() {


    if (
      document.hidden &&
      scanning
    ) {

      stopScanner(
        false
      );

    }

  }
);


// =====================================================
// PAGE CLOSE
// =====================================================

window.addEventListener(
  'beforeunload',
  function() {


    if (scanner) {

      try {

        scanner.stop();

      } catch (e) {}

    }

  }
);


</script>


</body>

</html>
