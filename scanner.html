<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>POG Camera Scanner</title>


  <!-- HTML5 QR CODE -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;

      background: #111;
      color: white;

      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 500px;

      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;

      margin-top: 15px;

      background: #222;

      border-radius: 10px;

      overflow: hidden;
    }

    .result {
      margin-top: 15px;

      padding: 15px;

      background: white;

      color: #111;

      border-radius: 8px;

      text-align: center;
    }

    #barcodeResult {

      margin-top: 5px;

      font-size: 22px;

      font-weight: bold;

      word-break: break-all;

    }

    .status {

      margin-top: 15px;

      text-align: center;

      color: #aaa;

      font-size: 13px;

      min-height: 20px;

    }

    button {

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      border: 0;

      border-radius: 8px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    #start {

      background: #0d8a43;

      color: white;

    }

    #stop {

      background: #d93025;

      color: white;

    }

    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📷 POG BARCODE SCANNER
  </h2>


  <!-- CAMERA -->
  <div id="reader"></div>


  <!-- HASIL BARCODE -->
  <div class="result">

    <div>
      BARCODE
    </div>

    <div id="barcodeResult">
      -
    </div>

  </div>


  <!-- STATUS -->
  <div
    id="status"
    class="status"
  >
    Menunggu kamera...
  </div>


  <!-- START -->
  <button
    id="start"
    onclick="startScanner()"
  >
    📷 MULAI SCAN
  </button>


  <!-- STOP -->
  <button
    id="stop"
    onclick="stopScanner()"
  >
    ❌ TUTUP KAMERA
  </button>


</div>


<script>


// ==================================================
// GLOBAL VARIABLE
// ==================================================

let scanner = null;

let scanning = false;

let sudahScan = false;


// ==================================================
// STATUS
// ==================================================

function setStatus(text) {

  const statusElement =
    document.getElementById('status');

  if (statusElement) {

    statusElement.textContent = text;

  }

}


// ==================================================
// START SCANNER
// ==================================================

async function startScanner() {

  if (scanning) {

    return;

  }


  sudahScan = false;


  setStatus(
    'Meminta izin kamera...'
  );


  const startButton =
    document.getElementById('start');

  const stopButton =
    document.getElementById('stop');


  startButton.disabled = true;

  stopButton.disabled = false;


  try {


    // ==============================================
    // CEK SECURE CONTEXT
    // ==============================================

    if (!window.isSecureContext) {

      throw new Error(
        'Halaman scanner harus dibuka melalui HTTPS.'
      );

    }


    // ==============================================
    // CEK SUPPORT KAMERA
    // ==============================================

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung akses kamera.'
      );

    }


    // ==============================================
    // BUAT SCANNER
    // ==============================================

    scanner =
      new Html5Qrcode('reader');


    // ==============================================
    // KONFIGURASI
    // ==============================================

    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );


        const width =
          Math.floor(
            minEdge * 0.85
          );


        const height =
          Math.floor(
            width * 0.45
          );


        return {

          width:
            Math.max(
              220,
              Math.min(
                width,
                400
              )
            ),

          height:
            Math.max(
              100,
              Math.min(
                height,
                180
              )
            )

        };

      },

      aspectRatio: 1.777778,

      disableFlip: false

    };


    // ==============================================
    // START CAMERA
    // ==============================================

    scanning = true;


    await scanner.start(

      {
        facingMode: 'environment'
      },

      config,


      function(decodedText) {


        // Hindari barcode terbaca berkali-kali

        if (sudahScan) {

          return;

        }


        sudahScan = true;


        barcodeBerhasil(
          decodedText
        );

      },


      function(errorMessage) {

        // Error scanning biasa
        // sengaja tidak ditampilkan

      }

    );


    setStatus(
      '✓ Kamera aktif - arahkan ke barcode'
    );


    startButton.disabled = false;

    stopButton.disabled = false;


  } catch (error) {


    console.error(
      'CAMERA ERROR:',
      error
    );


    scanning = false;

    scanner = null;


    startButton.disabled = false;

    stopButton.disabled = false;


    setStatus(
      '❌ Kamera gagal dibuka'
    );


    let pesan =
      '📷 KAMERA GAGAL DIBUKA\n\n';


    if (
      error.name ===
      'NotAllowedError'
    ) {

      pesan +=
        'Izin kamera ditolak.\n\n' +

        'Silakan buka pengaturan browser ' +
        'dan izinkan akses Camera.';


    }

    else if (
      error.name ===
      'NotFoundError'
    ) {

      pesan +=
        'Kamera tidak ditemukan.\n\n' +

        'Pastikan perangkat memiliki kamera.';


    }

    else if (
      error.name ===
      'NotReadableError'
    ) {

      pesan +=
        'Kamera sedang digunakan aplikasi lain.\n\n' +

        'Tutup aplikasi Camera, WhatsApp, atau ' +
        'aplikasi lain yang sedang menggunakan kamera.';


    }

    else if (
      error.name ===
      'SecurityError'
    ) {

      pesan +=
        'Akses kamera diblokir browser.\n\n' +

        'Pastikan scanner dibuka menggunakan HTTPS.';


    }

    else {

      pesan +=
        (
          error.message ||
          error.name ||
          'Unknown error'
        );

    }


    alert(pesan);

  }

}


// ==================================================
// BARCODE BERHASIL
// ==================================================

async function barcodeBerhasil(
  barcode
) {


  barcode =
    String(
      barcode || ''
    ).trim();


  if (!barcode) {

    return;

  }


  // ==============================================
  // TAMPILKAN HASIL
  // ==============================================

  document.getElementById(
    'barcodeResult'
  ).textContent =
    barcode;


  setStatus(
    '✓ Barcode berhasil dibaca'
  );


  // ==============================================
  // GETAR HP
  // ==============================================

  if (
    navigator.vibrate
  ) {

    try {

      navigator.vibrate(
        [100, 50, 100]
      );

    } catch (e) {}

  }


  // ==============================================
  // STOP CAMERA
  // ==============================================

  await stopScanner();


  // ==============================================
  // KIRIM KE HALAMAN UTAMA
  // ==============================================

  kirimBarcodeKeParent(
    barcode
  );

}


// ==================================================
// KIRIM BARCODE KE HALAMAN UTAMA
// ==================================================

function kirimBarcodeKeParent(
  barcode
) {


  // ==============================================
  // CEK WINDOW OPENER
  // ==============================================

  if (
    !window.opener ||
    window.opener.closed
  ) {

    setStatus(
      '⚠ Halaman utama tidak ditemukan.'
    );


    alert(
      'Halaman utama POG SCAN tidak ditemukan.\n\n' +

      'Silakan buka scanner melalui tombol ' +
      '"SCAN BARCODE DENGAN KAMERA" pada aplikasi utama.'
    );


    return;

  }


  // ==============================================
  // AMBIL RETURN ORIGIN
  // ==============================================

  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnOrigin =
    params.get(
      'returnOrigin'
    );


  if (!returnOrigin) {

    setStatus(
      '⚠ Return origin tidak ditemukan.'
    );


    alert(
      'Scanner tidak mendapatkan alamat aplikasi utama.'
    );


    return;

  }


  // ==============================================
  // KIRIM POST MESSAGE
  // ==============================================

  try {


    window.opener.postMessage(

      {

        type:
          'POG_BARCODE',

        barcode:
          barcode

      },

      returnOrigin

    );


    setStatus(
      '✓ Barcode berhasil dikirim ke aplikasi utama'
    );


    // ============================================
    // TUTUP WINDOW
    // ============================================

    setTimeout(
      function() {

        try {

          window.close();

        } catch (e) {

          console.log(
            'Window close:',
            e
          );

        }

      },
      500
    );


  } catch (error) {


    console.error(
      'POST MESSAGE ERROR:',
      error
    );


    setStatus(
      '❌ Gagal mengirim barcode'
    );


    alert(
      'Barcode berhasil dibaca tetapi gagal dikirim ' +
      'ke halaman utama.'
    );

  }

}


// ==================================================
// STOP SCANNER
// ==================================================

async function stopScanner() {


  try {


    if (
      scanner &&
      scanning
    ) {

      await scanner.stop();

    }


  } catch (error) {

    console.error(
      'STOP CAMERA ERROR:',
      error
    );

  }


  try {


    if (scanner) {

      scanner.clear();

    }


  } catch (error) {

    console.log(
      'CLEAR SCANNER:',
      error
    );

  }


  scanner = null;

  scanning = false;

  sudahScan = false;


  document.getElementById(
    'start'
  ).disabled = false;


  document.getElementById(
    'stop'
  ).disabled = false;


}


// ==================================================
// AUTO START CAMERA
// ==================================================

window.addEventListener(
  'load',
  function() {


    setTimeout(
      function() {

        startScanner();

      },
      500
    );


  }
);


</script>


</body>

</html>
